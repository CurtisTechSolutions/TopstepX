[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "topstepx"
dynamic = ["version"]
description = "Python SDK for the ProjectX Gateway API as deployed by TopstepX: REST client and SignalR realtime hubs"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "CurtisTechSolutions" }]
keywords = ["topstepx", "projectx", "trading", "futures", "signalr", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=15.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/CurtisTechSolutions/TopstepX"
Documentation = "https://github.com/CurtisTechSolutions/TopstepX/tree/main/python#readme"

[tool.hatch.version]
path = "src/topstepx/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/topstepx"]

[tool.hatch.build.targets.sdist]
include = ["src/topstepx", "README.md", "LICENSE", "pyproject.toml"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "PT",    # flake8-pytest-style
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "S",     # flake8-bandit
    "D",     # pydocstyle
]
ignore = [
    "D105",   # magic methods are self-explanatory
    "D107",   # __init__ is documented on the class
    "RUF022", # keep __all__ grouped by topic rather than sorted
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S301", "PERF", "ASYNC"]
"examples/**" = ["S101", "T201"]

[tool.ruff.format]
docstring-code-format = true
