  "/api/Auth/loginKey":
    post:
      tags:
        - "Auth"
      summary: "Create a session using an API key"
      description: "Submit the platform username and API key. Business failures use HTTP 200; inspect success and errorCode. Missing credentials produce HTTP 400. Reuse the returned JWT for REST and SignalR. Tokens last 24 hours. Refresh before expiry or log in again after expiry. Existing tokens remain valid after another login."
      operationId: "Auth_LoginKey"
      externalDocs:
        url: "https://gateway.docs.projectx.com/docs/getting-started/authenticate/authenticate-api-key/"
      x-documentation-status: "guide-and-swagger"
      responses:
        "200":
          description: "Operation result. Inspect success and errorCode when present."
          content:
            "text/plain":
              schema:
                $ref: "#/components/schemas/LoginResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                illustrative:
                  summary: "Synthetic result consistent with the assembled schema; not a captured server response."
                  value:
                    success: true
                    errorCode: 0
                    errorMessage: null
                    hasBusinessFailure: false
                    token: "EXAMPLE_JWT_TOKEN"
                invalidCredentials:
                  summary: "Invalid API-key credentials return HTTP 200."
                  value:
                    success: false
                    errorCode: 3
                    errorMessage: null
                    hasBusinessFailure: true
                    token: null
            "text/json":
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: "userName or apiKey is missing. The guide does not specify the response-body shape."
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      requestBody:
        required: true
        content:
