info:
  title: "ProjectX Gateway API — derived reference"
  version: "2026-09-29.1"
  description: "OpenAPI conversion of the linked ProjectX Swagger 2.0 schema, enriched from the public guides on 2026-09-29. Contains 16 guide-documented operations and 5 Swagger-only operations. This is a derived artifact, not a vendor release. Source conflicts and modeling decisions are recorded in README.md. Examples are synthetic and were not sent to the API. SignalR is documented separately in realtime.md. Request examples use historical contract identifiers solely to show shape. Replace them with current values returned by contract discovery."
servers:
  -
    url: "https://api.topstepx.com"
    description: "TopstepX connection published by the source documentation; other firms may use different URLs."
externalDocs:
  description: "ProjectX source documentation"
  url: "https://gateway.docs.projectx.com/docs/intro/"
security:
  -
    bearerAuth: []
tags:
  -
    name: "Auth"
