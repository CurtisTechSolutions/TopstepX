          content:
            "text/plain":
              schema:
                $ref: "#/components/schemas/SearchAccountResponse"
            "application/json":
              schema:
                $ref: "#/components/schemas/SearchAccountResponse"
              examples:
                illustrative:
                  summary: "Synthetic result consistent with the assembled schema; not a captured server response."
                  value:
                    success: true
                    errorCode: 0
                    errorMessage: null
                    hasBusinessFailure: false
                    accounts:
                      -
                        id: 123
                        name: "EXAMPLE_ACCOUNT"
                        balance: 50000
                        canTrade: true
                        isVisible: true
                        simulated: true
            "text/json":
              schema:
                $ref: "#/components/schemas/SearchAccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
      requestBody:
