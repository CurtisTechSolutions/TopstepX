on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A personal access token (PAT) stored as the MY_RELEASE_PLEASE_TOKEN
          # secret. Tags that release-please creates with it start the publish
          # workflows; tags created with GITHUB_TOKEN would not.
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          # Each SDK is released on its own, with a tag per SDK (rust/vX.Y.Z,
          # python/vX.Y.Z, go/vX.Y.Z). See CONTRIBUTING.md.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
