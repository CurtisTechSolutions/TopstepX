name: Publish Rust SDK

# Publishes the topstepx crate to crates.io when release-please tags a Rust
# release (rust/vX.Y.Z). To retry a failed publish, run this workflow from the
# tag (Run workflow, then pick the tag under "Use workflow from").

on:
  push:
    tags: ["rust/v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/rust/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "rust/v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in rust/Cargo.toml."
            exit 1
          fi

      - name: Test
        run: |
          cargo --version
          cargo test --locked

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::The CARGO_REGISTRY_TOKEN secret is not set. Add a crates.io API token under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          cargo publish --locked
